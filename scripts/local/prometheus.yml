# Локальный Prometheus для боевого режима Auto SRE
# Скрейпит оба сервиса и считает правила из files/sre-agent/alerting/auto-sre-rules.yaml
global:
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/auto-sre-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sre-agent
    static_configs:
      - targets: ["sre-agent:8096"]

  - job_name: alert-analyzer
    static_configs:
      - targets: ["alert-analyzer:8097"]
