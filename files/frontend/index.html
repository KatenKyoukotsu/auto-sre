<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto SRE — стена аномалий</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/animations.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Auto SRE</a>
      <nav>
        <a href="/" class="active">Стена аномалий</a>
        <a href="/blog">Блог</a>
      </nav>
      <button id="trigger-scan" class="btn">Запустить скан</button>
    </div>
  </header>

  <main class="container">
    <section class="status" id="status"></section>

    <section class="fullscan">
      <h2>Полное сканирование</h2>
      <p class="hint">Перебирает все потоки логов за выбранный диапазон (по умолчанию — последние 24 часа) без ограничения по числу контейнеров.</p>
      <div class="fullscan-controls">
        <label>С: <input type="datetime-local" id="fs-start"></label>
        <label>По: <input type="datetime-local" id="fs-end"></label>
        <span class="presets">
          <button class="btn small preset" data-hours="1">1ч</button>
          <button class="btn small preset" data-hours="6">6ч</button>
          <button class="btn small preset" data-hours="24">24ч</button>
        </span>
        <button id="trigger-full-scan" class="btn">Запустить полный скан</button>
        <span id="fs-status" class="fs-status"></span>
      </div>
    </section>

    <h1>Что не так в проде</h1>

    <div id="findings"></div>
  </main>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script type="module" src="/static/js/wall.js"></script>
</body>
</html>
